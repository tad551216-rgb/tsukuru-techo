<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>おはしのれんしゅう ｜ つくる手帖</title>
<style>
  :root{
    --cream:#f6f1e3;
    --cream-deep:#efe7d2;
    --ink:#2b3a67;        /* 藍 */
    --ink-soft:#4a5a86;
    --vermilion:#d1503a;  /* 朱 */
    --line:#d9cfb4;
    --paper-line:rgba(43,58,103,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    color:var(--ink);
    background-color:var(--cream);
    background-image:
      linear-gradient(var(--paper-line) 1px,transparent 1px),
      linear-gradient(90deg,var(--paper-line) 1px,transparent 1px);
    background-size:24px 24px;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .card{
    width:100%;
    max-width:520px;
    background:#fffdf7;
    border:1.5px solid var(--line);
    border-radius:20px;
    box-shadow:0 10px 30px rgba(43,58,103,.10);
    overflow:hidden;
    align-self:flex-start;
  }
  .eyebrow{
    display:flex;align-items:center;gap:8px;
    padding:18px 22px 0;
    font-size:13px;letter-spacing:.08em;color:var(--ink-soft);
  }
  .eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--vermilion);}
  h1{
    margin:6px 22px 16px;
    font-size:24px;font-weight:800;letter-spacing:.02em;
  }
  .figure{
    margin:0 22px;
    border:1px solid var(--line);
    border-radius:14px;
    background:var(--cream-deep);
    overflow:hidden;
    aspect-ratio:16/9;
    display:flex;align-items:center;justify-content:center;
  }
  .figure img{width:100%;height:100%;object-fit:contain;display:block;}
  .figure .missing{
    padding:24px;text-align:center;font-size:14px;color:var(--ink-soft);line-height:1.7;
  }
  .player{
    padding:18px 22px 22px;
  }
  .controls{display:flex;align-items:center;gap:14px;}
  .play{
    flex:0 0 auto;
    width:58px;height:58px;border-radius:50%;
    border:none;cursor:pointer;
    background:var(--vermilion);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 14px rgba(209,80,58,.35);
    transition:transform .08s ease;
  }
  .play:active{transform:scale(.94);}
  .play svg{width:26px;height:26px;}
  .bar-wrap{flex:1 1 auto;}
  .time{
    display:flex;justify-content:space-between;
    font-size:12px;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;margin-bottom:6px;
  }
  .track{
    position:relative;height:8px;border-radius:6px;
    background:var(--cream-deep);border:1px solid var(--line);
    cursor:pointer;
  }
  .fill{
    position:absolute;left:0;top:0;bottom:0;width:0%;
    background:var(--ink);border-radius:6px;
  }
  .script{
    margin:16px 22px 24px;
    padding:16px 18px;
    background:var(--cream);
    border-left:4px solid var(--vermilion);
    border-radius:0 10px 10px 0;
    font-size:15px;line-height:2;color:var(--ink-soft);
  }
  .hint{
    margin:0 22px 22px;font-size:12px;color:var(--ink-soft);line-height:1.7;opacity:.85;
  }
  @media (prefers-reduced-motion:reduce){.play{transition:none;}}
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow"><span class="dot"></span>りょういくプログラムのたね</div>
    <h1>おはしのれんしゅう</h1>

    <div class="figure">
      <img id="pic" alt="おはしで豆をつまむ子どもと、見守る大人のイラスト">
      <div class="missing" id="picMissing" hidden>
        画像が見つかりません。<br>この HTML と同じフォルダに<br><b>ohashi.png</b>（または .jpg）を置いてください。
      </div>
    </div>

    <div class="player">
      <div class="controls">
        <button class="play" id="playBtn" aria-label="さいせい">
          <svg id="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path id="iconPath" d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <div class="bar-wrap">
          <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
          <div class="track" id="track"><div class="fill" id="fill"></div></div>
        </div>
      </div>
    </div>

    <p class="script">
      きょうは、おはしのれんしゅうです。<br>
      おやゆびと、ひとさしゆび、なかゆびで、うえのおはしをもちます。<br>
      まめを、ひとつずつ、そうっとつまんでみましょう。<br>
      うまくできたら、たくさんほめてあげてください。
    </p>

    <p class="hint" id="hint">▶ をおすと、おんせいがながれます。</p>

    <audio id="audio" preload="metadata"></audio>
  </main>

<script>
(function(){
  var audio = document.getElementById('audio');
  var pic   = document.getElementById('pic');
  var picMissing = document.getElementById('picMissing');
  var playBtn = document.getElementById('playBtn');
  var iconPath = document.getElementById('iconPath');
  var cur = document.getElementById('cur');
  var dur = document.getElementById('dur');
  var track = document.getElementById('track');
  var fill = document.getElementById('fill');
  var hint = document.getElementById('hint');

  var PLAY = "M8 5v14l11-7z";
  var PAUSE = "M6 5h4v14H6zM14 5h4v14h-4z";

  // 画像：png → jpg の順に試す
  var imgCandidates = ["ohashi.png","ohashi.jpg","ohashi.jpeg"];
  (function tryImg(i){
    if(i>=imgCandidates.length){ pic.hidden=true; picMissing.hidden=false; return; }
    pic.onerror=function(){ tryImg(i+1); };
    pic.onload=function(){ picMissing.hidden=true; };
    pic.src=imgCandidates[i];
  })(0);

  // 音声：mp3 → wav の順に試す
  var audioCandidates = ["ohashi.mp3","ohashi.wav"];
  (function tryAudio(i){
    if(i>=audioCandidates.length){
      hint.textContent="おんせいファイル（ohashi.mp3 または .wav）が同じフォルダに見つかりません。";
      return;
    }
    audio.onerror=function(){ tryAudio(i+1); };
    audio.src=audioCandidates[i];
  })(0);

  function fmt(s){
    if(isNaN(s)||!isFinite(s)) return "0:00";
    var m=Math.floor(s/60), r=Math.floor(s%60);
    return m+":"+(r<10?"0":"")+r;
  }

  audio.addEventListener('loadedmetadata',function(){ dur.textContent=fmt(audio.duration); });
  audio.addEventListener('timeupdate',function(){
    cur.textContent=fmt(audio.currentTime);
    var p = audio.duration ? (audio.currentTime/audio.duration*100) : 0;
    fill.style.width=p+"%";
  });
  audio.addEventListener('ended',function(){ iconPath.setAttribute('d',PLAY); fill.style.width="0%"; audio.currentTime=0; });

  playBtn.addEventListener('click',function(){
    if(audio.paused){ audio.play(); iconPath.setAttribute('d',PAUSE); }
    else{ audio.pause(); iconPath.setAttribute('d',PLAY); }
  });

  track.addEventListener('click',function(e){
    if(!audio.duration) return;
    var rect=track.getBoundingClientRect();
    var ratio=(e.clientX-rect.left)/rect.width;
    audio.currentTime=Math.max(0,Math.min(1,ratio))*audio.duration;
  });
})();
</script>
</body>
</html>
